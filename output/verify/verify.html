<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDOM Verify</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #20232a;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    #summary {
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 700;
    }

    #results {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .result {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ccd2da;
      background: #ffffff;
    }

    .result.pass {
      border-color: #77c66e;
      background: #eefbea;
    }

    .result.fail {
      border-color: #e26b6b;
      background: #fff0f0;
    }

    .name {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .detail {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    iframe {
      width: 1280px;
      height: 900px;
      border: 2px solid #b7bcc6;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Virtual DOM Verification</h1>
  <div id="summary">Running...</div>
  <div id="results"></div>
  <iframe id="app-frame" src="/index.html" title="app"></iframe>

  <script>
    const results = [];
    const summaryNode = document.getElementById("summary");
    const resultsNode = document.getElementById("results");

    function sleep(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function waitFor(check, timeout = 5000, interval = 50) {
      const start = Date.now();

      while (Date.now() - start < timeout) {
        const value = check();

        if (value) {
          return value;
        }

        await sleep(interval);
      }

      throw new Error("Timed out while waiting for condition.");
    }

    function addResult(name, passed, detail) {
      results.push({ name, passed, detail });

      const article = document.createElement("article");
      article.className = `result ${passed ? "pass" : "fail"}`;
      article.innerHTML = `
        <span class="name">${passed ? "PASS" : "FAIL"} - ${name}</span>
        <div class="detail">${detail}</div>
      `;
      resultsNode.appendChild(article);
    }

    async function reportResults() {
      const payload = {
        passed: results.every((item) => item.passed),
        results
      };

      summaryNode.textContent = payload.passed ? "PASS" : "FAIL";

      try {
        await fetch("http://127.0.0.1:4174/report", {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        addResult("Report transport", false, String(error));
      }
    }

    async function run() {
      try {
        const frame = document.getElementById("app-frame");
        await waitFor(() => frame.contentDocument && frame.contentDocument.getElementById("patch-button"));

        const doc = frame.contentDocument;
        const click = (selector) => doc.querySelector(selector).dispatchEvent(new MouseEvent("click", { bubbles: true }));
        const getText = (selector) => (doc.querySelector(selector)?.textContent || "").replace(/\s+/g, " ").trim();
        const getValue = (selector) => doc.querySelector(selector)?.value || "";

        await waitFor(() => getText("#actual-canvas").includes("Virtual DOM Demo"));
        addResult("Initial render", getText("#actual-canvas").includes("Virtual DOM Demo"), getText("#actual-canvas"));

        click('[data-test-id="1"]');
        await sleep(80);
        click("#patch-button");
        await sleep(180);

        const afterTextPatch = getText("#actual-canvas");
        const diffAfterTextPatch = getText("#diff-log");
        addResult(
          "PATCH text change",
          afterTextPatch.includes("Text Update") && diffAfterTextPatch.includes("TEXT"),
          `actual: ${afterTextPatch}\ndiff: ${diffAfterTextPatch}`
        );

        addResult("History advanced", getText("#history-status") === "1 / 1", getText("#history-status"));

        click("#undo-button");
        await sleep(180);
        const afterUndo = getText("#actual-canvas");
        addResult("UNDO restore", afterUndo.includes("Virtual DOM Demo") && !afterUndo.includes("Text Update"), afterUndo);

        click("#redo-button");
        await sleep(180);
        const afterRedo = getText("#actual-canvas");
        addResult("REDO restore", afterRedo.includes("Text Update"), afterRedo);

        click('[data-test-id="3"]');
        await sleep(80);
        click("#patch-button");
        await sleep(180);
        addResult(
          "ADD patch",
          doc.querySelectorAll("#actual-canvas li").length === 4 && getText("#diff-log").includes("ADD"),
          `li count: ${doc.querySelectorAll("#actual-canvas li").length}\ndiff: ${getText("#diff-log")}`
        );

        click('[data-test-id="2"]');
        await sleep(80);
        click("#patch-button");
        await sleep(180);

        const secondaryButton = doc.querySelector("#actual-canvas .secondary-button");
        addResult(
          "PROPS patch",
          secondaryButton && !secondaryButton.hasAttribute("disabled") && getText("#diff-log").includes("PROPS"),
          `disabled: ${secondaryButton?.hasAttribute("disabled")}\ndiff: ${getText("#diff-log")}`
        );

        addResult("Mutation log updated", getText("#mutation-log").length > 0, getText("#mutation-log"));
        addResult("Preview sync", getText("#preview-canvas").includes("Enabled sample"), getText("#preview-canvas"));
        addResult(
          "DOM editor sync",
          getValue("#dom-editor").includes('"nodeType"') && getValue("#dom-editor").includes('"ELEMENT"'),
          getValue("#dom-editor").slice(0, 240)
        );

        const boardShell = doc.querySelector(".board-shell");
        const initialShellHeight = Math.round(boardShell.getBoundingClientRect().height);
        const initialPageHeight = Math.round(doc.documentElement.scrollHeight);

        const overflowItems = Array.from({ length: 80 }, (_, index) => {
          return `<li class="feature-item">Overflow item ${index + 1}</li>`;
        }).join("");
        const overflowHTML = `
          <section id="overflow-panel" class="demo-section overflow-case" data-role="product" data-version="99">
            <h2>
              Overflow Case
              <span class="status-badge" data-tone="cool">Scrollable</span>
            </h2>
            <p class="intro">${"Long preview content ".repeat(30)}</p>
            <ul class="feature-list" data-count="80">
              ${overflowItems}
            </ul>
            <div class="action-row" data-group="primary">
              <button type="button" class="primary-button">Primary</button>
              <button type="button" class="secondary-button">Secondary</button>
            </div>
          </section>
        `.trim();

        const htmlEditor = doc.getElementById("html-editor");
        htmlEditor.value = overflowHTML;
        htmlEditor.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(180);

        const previewCanvas = doc.getElementById("preview-canvas");
        const domEditor = doc.getElementById("dom-editor");
        const shellHeightAfterInput = Math.round(boardShell.getBoundingClientRect().height);
        const pageHeightAfterInput = Math.round(doc.documentElement.scrollHeight);

        addResult(
          "Preview panel scroll",
          shellHeightAfterInput === initialShellHeight && previewCanvas.scrollHeight > previewCanvas.clientHeight,
          `shell before/after: ${initialShellHeight}/${shellHeightAfterInput}\npage before/after: ${initialPageHeight}/${pageHeightAfterInput}\npreview scrollHeight/clientHeight: ${previewCanvas.scrollHeight}/${previewCanvas.clientHeight}`
        );

        addResult(
          "HTML editor scroll",
          htmlEditor.scrollHeight > htmlEditor.clientHeight,
          `html editor scrollHeight/clientHeight: ${htmlEditor.scrollHeight}/${htmlEditor.clientHeight}`
        );

        addResult(
          "DOM editor scroll",
          domEditor.scrollHeight > domEditor.clientHeight,
          `dom editor scrollHeight/clientHeight: ${domEditor.scrollHeight}/${domEditor.clientHeight}`
        );

        click("#patch-button");
        await sleep(220);

        const actualCanvas = doc.getElementById("actual-canvas");
        const diffLog = doc.getElementById("diff-log");
        const mutationLog = doc.getElementById("mutation-log");
        const shellHeightAfterPatch = Math.round(boardShell.getBoundingClientRect().height);
        const pageHeightAfterPatch = Math.round(doc.documentElement.scrollHeight);

        addResult(
          "Actual panel scroll",
          shellHeightAfterPatch === initialShellHeight && actualCanvas.scrollHeight > actualCanvas.clientHeight,
          `shell after patch: ${shellHeightAfterPatch}\npage after patch: ${pageHeightAfterPatch}\nactual scrollHeight/clientHeight: ${actualCanvas.scrollHeight}/${actualCanvas.clientHeight}`
        );

        addResult(
          "Diff log scroll",
          diffLog.scrollHeight > diffLog.clientHeight,
          `diff scrollHeight/clientHeight: ${diffLog.scrollHeight}/${diffLog.clientHeight}`
        );

        addResult(
          "Mutation log scroll",
          mutationLog.scrollHeight > mutationLog.clientHeight,
          `mutation scrollHeight/clientHeight: ${mutationLog.scrollHeight}/${mutationLog.clientHeight}`
        );
      } catch (error) {
        addResult("Harness execution", false, String(error));
      }

      await reportResults();
    }

    window.addEventListener("load", run);
  </script>
</body>
</html>
