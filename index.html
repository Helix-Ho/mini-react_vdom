<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JS Virtual DOM Diff Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <main class="board-shell">
      <section class="board-layout">
        <aside class="stack-column log-rail">
          <article class="board-card card compact-card">
            <div class="card-outline outline-diff">
              <div class="side-panel-head" style="justify-content: flex-start;">
                <h2 style="margin:0; text-align:left;">DIFF LOG</h2>
              </div>
              <div id="diff-log" class="log-list" aria-live="polite"></div>
            </div>
          </article>

          <article class="board-card card compact-card">
            <div class="card-outline outline-mutation">
              <div class="side-panel-head" style="justify-content: flex-start;">
                <h2 style="margin:0; text-align:left;">MUTATION LOG</h2>
              </div>
              <div id="mutation-log" class="log-list" aria-live="polite"></div>
            </div>
          </article>
        </aside>

        <section class="stack-column main-stage">
          <article class="board-card card">
            <div class="card-outline outline-main">
              <div class="panel-head">
                <div>
                  <p class="panel-kicker">Applied Result</p>
                  <h2>실제 영역</h2>
                </div>
                <div class="status-pill">
                  <span>HISTORY</span>
                  <strong id="history-status">0 / 0</strong>
                </div>
              </div>
              <div id="actual-canvas" class="board-canvas actual-canvas" aria-live="polite"></div>
            </div>
          </article>

          <article class="board-card card">
            <div class="card-outline outline-main muted-outline">
              <div class="panel-head">
                <div>
                  <p class="panel-kicker">Pending Preview</p>
                  <h2>프리뷰 영역</h2>
                </div>
              </div>
              <div id="preview-canvas" class="board-canvas preview-canvas" aria-live="polite"></div>
            </div>
          </article>
        </section>

        <section class="stack-column editor-stage">
          <article class="board-card card">
            <div class="card-outline outline-editor">
              <div class="panel-head">
                <div>
                  <p class="panel-kicker">Source Input</p>
                  <h2>HTML 형식 편집 영역</h2>
                </div>
              </div>
              <label class="sr-only" for="html-editor">HTML editor</label>
              <textarea id="html-editor" class="editor-surface html-editor" spellcheck="false"></textarea>
              <p id="parser-note" class="panel-note">
                브라우저 파서가 잘못된 HTML을 자동 보정하며, <code>script</code> 태그와 <code>on*</code> 이벤트 속성은 제거합니다.
              </p>
            </div>
          </article>

          <article class="board-card card">
            <div class="card-outline outline-editor">
              <div class="panel-head">
                <div>
                  <p class="panel-kicker">Structure View</p>
                    <h2>DOM 형식 편집 영역</h2>
                </div>
              </div>

              <label class="sr-only" for="dom-editor">DOM structure</label>
              <textarea id="dom-editor" class="editor-surface dom-editor" spellcheck="false" readonly></textarea>
            </div>
          </article>
        </section>
      </section>

      <section class="command-bar card">
        <div class="command-group primary-actions">
          <button id="undo-button" class="action-button" type="button">UNDO</button>
          <button id="patch-button" class="action-button primary" type="button">PATCH</button>
          <button id="redo-button" class="action-button" type="button">REDO</button>
        </div>
        <div class="status-pill wide command-status">
          <span>LAST PATCH</span>
          <strong id="patch-summary">초기 상태를 준비하는 중...</strong>
        </div>
        <div class="command-group test-actions">
          <button class="action-button test-button" type="button" data-test-id="1">&#53581;&#49828;&#53944; &#48320;&#44221;</button>
          <button class="action-button test-button" type="button" data-test-id="2">&#49549;&#49457; &#48320;&#44221;</button>
          <button class="action-button test-button" type="button" data-test-id="3">&#45432;&#46300; &#52628;&#44032;</button>
          <button class="action-button test-button" type="button" data-test-id="4">&#45432;&#46300; &#51228;&#44144;</button>
          <button class="action-button test-button" type="button" data-test-id="5">&#53468;&#44536; &#44368;&#52404;</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
